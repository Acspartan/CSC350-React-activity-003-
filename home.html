
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CSC 350 - React003 Movie Application</title>

  <!-- Bulma CSS framework -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- React libraries -->
  <script crossorigin
          src="https://unpkg.com/react@17/umd/react.development.js"></script>

  <script crossorigin
          src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>

  <!-- Babel converts JSX into JavaScript -->
  <script
          src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Import movie data -->
  <script src="movie-data.js"></script>

</head>

<body>

<!-- React application will appear inside this container -->
<div id="react-container"></div>


<script type="text/babel">

  /*
  ------------------------------------------------------------
  APP COMPONENT
  Stores movie information and manages changes to the movies.
  ------------------------------------------------------------
  */

  class App extends React.Component {

    // Initialize movie data in React state
    constructor(props) {
      super(props);

      this.state = {
        movies: movieData
      };

      // Bind the method so it can update component state
      this.saveChanges = this.saveChanges.bind(this);
    }

    // Update a movie when a form field changes
    saveChanges(index, updatedMovie) {

      this.setState((prevState) => {

        // Create a copy of the current movies array
        const updatedMovies = [...prevState.movies];

        // Replace the selected movie with the updated movie
        updatedMovies[index] = updatedMovie;

        // Update state and automatically refresh the display
        return {
          movies: updatedMovies
        };
      });
    }

    render() {
      return (
              <main className="container">

                <section className="columns has-background-light">

                  {/* Left side: Display all movies */}
                  <MovieList movies={this.state.movies} />

                  {/* Right side: Display forms for editing movies */}
                  <div className="column is-half">

                    {/* Create one MovieForm for every movie */}
                    {this.state.movies.map((movie, index) => (

                            <MovieForm
                                    key={index}
                                    index={index}
                                    movie={movie}
                                    saveChanges={this.saveChanges}
                            />

                    ))}

                  </div>

                </section>

              </main>
      );
    }
  }


  /*
  ------------------------------------------------------------
  MOVIE FORM COMPONENT
  Controlled form for changing movie information.
  ------------------------------------------------------------
  */

  class MovieForm extends React.Component {

    // Handle changes to the form inputs
    handleChange = (event) => {

      // Get the name and value of the changed input
      const { name, value } = event.target;

      // Copy the movie and update only the changed property
      const updatedMovie = {
        ...this.props.movie,
        [name]: value
      };

      // Send the updated movie to the App component
      this.props.saveChanges(
              this.props.index,
              updatedMovie
      );
    };

    render() {

      // Get the movie passed into the component
      const movie = this.props.movie;

      return (
              <form
                      className="panel has-background-grey-lighter"
                      onSubmit={(event) => event.preventDefault()}
              >

                {/* Movie Title */}
                <div className="field is-horizontal">

                  <div className="field-label is-normal">
                    <label className="label">Title</label>
                  </div>

                  <div className="field-body">

                    <input
                            className="input"
                            type="text"
                            name="title"
                            value={movie.title || ""}
                            onChange={this.handleChange}
                    />

                  </div>
                </div>


                {/* Movie Tagline */}
                <div className="field is-horizontal">

                  <div className="field-label is-normal">
                    <label className="label">Tagline</label>
                  </div>

                  <div className="field-body">

                            <textarea
                                    className="textarea"
                                    rows="2"
                                    name="tagline"
                                    value={movie.tagline || ""}
                                    onChange={this.handleChange}
                            />

                  </div>
                </div>


                {/* Movie Runtime */}
                <div className="field is-horizontal">

                  <div className="field-label is-normal">
                    <label className="label">Runtime</label>
                  </div>

                  <div className="field-body">

                    <input
                            className="input"
                            type="text"
                            name="runtime"
                            value={movie.runtime ?? ""}
                            onChange={this.handleChange}
                    />

                  </div>
                </div>

              </form>
      );
    }
  }


  /*
  ------------------------------------------------------------
  MOVIE LIST COMPONENT
  Uses map() to display every movie in the movies array.
  ------------------------------------------------------------
  */

  class MovieList extends React.Component {

    render() {

      return (
              <div className="column is-half">

                <ul className="columns is-multiline">

                  {/* Loop through all movies */}
                  {this.props.movies.map((movie, index) => (

                          <SingleMovie
                                  key={index}
                                  movie={movie}
                          />

                  ))}

                </ul>

              </div>
      );
    }
  }


  /*
  ------------------------------------------------------------
  SINGLE MOVIE COMPONENT
  Displays a movie poster, title, runtime, and tagline.
  ------------------------------------------------------------
  */

  class SingleMovie extends React.Component {

    render() {

      // Get the movie object from MovieList
      const movie = this.props.movie;

      // Support common movie poster property names
      const poster = movie.poster_path || movie.poster;

      // Create the full poster URL
      const posterURL = poster
              ? poster.startsWith("http")
                      ? poster
                      : "https://image.tmdb.org/t/p/w185/" +
                      poster.replace(/^\/+/, "")
              : "";

      return (

              <li className="column is-one-third-desktop is-half-tablet">

                <div className="card">

                  {/* Movie Poster */}
                  <div className="card-image">

                    <figure className="image is-2by3">

                      <img
                              src={posterURL}
                              alt={movie.title}
                      />

                    </figure>

                  </div>


                  {/* Movie Information */}
                  <div className="card-content has-text-centered content-rectangle">

                    {/* Movie Title and Runtime */}
                    <h2 className="title is-6">

                      {movie.title} ({movie.runtime} min)

                    </h2>

                    {/* Movie Tagline */}
                    <p className="is-size-7">

                      {movie.tagline}

                    </p>

                  </div>


                  {/* Movie TMDB Link */}
                  <footer className="card-footer">

                    <MovieLink tmdbID={movie.tmdbID} />

                  </footer>

                </div>

              </li>
      );
    }
  }


  /*
  ------------------------------------------------------------
  MOVIE LINK COMPONENT
  Functional component that creates a link to TMDB.
  ------------------------------------------------------------
  */

  const MovieLink = (props) => {

    return (

            <a
                    className="button card-footer-item"
                    href={
                            "https://www.themoviedb.org/movie/" +
                            props.tmdbID
                    }
                    target="_blank"
                    rel="noopener noreferrer"
            >

              {/* TMDB Logo */}
              <img
                      src="images/tmdb.svg"
                      width="30"
                      alt="TMDB"
              />

            </a>

    );
  };


  /*
  ------------------------------------------------------------
  RENDER APPLICATION
  Displays the App component inside the HTML container.
  ------------------------------------------------------------
  */

  ReactDOM.render(
          <App />,
          document.querySelector("#react-container")
  );

</script>

</body>
</html>
